    <script>
      // Ignore HMR WebSocket connection errors in preview environments
      window.addEventListener('error', function(e) {
        if (
          e.message && (
            e.message.includes('WebSocket') ||
            e.message.includes('createWebSocketModuleRunnerTransport') ||
            e.message.includes('vite')
          )
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        const msg = (e.reason && (e.reason.message || String(e.reason))) || '';
        if (msg.includes('WebSocket') || msg.includes('createWebSocketModuleRunnerTransport') || msg.includes('vite')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
